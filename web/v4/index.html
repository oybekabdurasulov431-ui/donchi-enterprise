<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233d"><title>DONCHI Enterprise 4.0 · Control Center</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#17253d;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}.top{background:#10253f;color:white;padding:16px clamp(16px,4vw,44px);display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}.brand{font-size:18px;font-weight:800;letter-spacing:.04em}.brand small{font-weight:400;display:block;color:#afc6e2;font-size:11px;letter-spacing:0}.top a{color:#daeaff;text-decoration:none;border:1px solid #425f7d;border-radius:10px;padding:9px 12px;font-size:13px}.wrap{max-width:1400px;margin:auto;padding:28px clamp(14px,4vw,40px)}h1{font-size:clamp(24px,3vw,34px);margin:0 0 5px}h2{font-size:18px;margin:0 0 15px}p{color:#65768e;margin:4px 0 16px;font-size:14px}.sub{color:#8090a4}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 18px;scrollbar-width:thin}.nav button{background:white;border:1px solid #d9e1ea;color:#40526c;border-radius:12px;padding:12px 15px;white-space:nowrap;font-size:13px;font-weight:650}.nav button.active{background:#163c6c;border-color:#163c6c;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.card{background:white;border:1px solid #e0e7ef;border-radius:16px;box-shadow:0 5px 24px #14315b09}.metric{padding:19px;min-width:0}.metric label{color:#677b93;font-size:12px;display:block}.metric strong{font-size:clamp(21px,2.3vw,29px);display:block;margin-top:9px;overflow-wrap:anywhere}.metric small{font-size:11px;color:#8493a5}.card{padding:20px;margin-top:18px}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{background:#f6f9fc;color:#6d7f95;font-size:11px;text-transform:uppercase;letter-spacing:.035em}th,td{padding:14px 11px;border-bottom:1px solid #e9edf3;white-space:nowrap}td:first-child{font-weight:650}.tag{background:#e7f7f0;color:#167254;border-radius:999px;padding:5px 10px;font-size:11px;display:inline-block}.tag.off{background:#fff1eb;color:#a95832}.action{border:0;border-radius:8px;background:#eaf1fa;color:#174a81;padding:8px 12px;font-size:12px;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}input{background:#f8fafc;border:1px solid #dbe3ed;border-radius:9px;padding:11px;min-width:200px;max-width:100%;font:inherit}.notice{border:1px solid #d6e4f4;background:#f0f6fd;color:#365f8b;padding:15px 17px;border-radius:12px;margin-top:16px;font-size:13px}.bad{background:#fff2ec;color:#9b4c20;border-color:#f0dbce}.skeleton{padding:22px;color:#677b93;text-align:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}.mini{display:flex;justify-content:space-between;border-bottom:1px solid #edf1f5;padding:11px 0;gap:8px}.mini span{color:#71829a}.mini strong{text-align:right;overflow-wrap:anywhere}.click{color:#165e99;cursor:pointer}.pill{font-size:11px;padding:6px 10px;background:#f1f4f8;border-radius:999px;white-space:nowrap}.footer{font-size:12px;color:#8a98ab;margin-top:24px}@media(max-width:1020px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.wrap{padding:19px 12px}.top{padding:13px 16px}.grid{gap:9px}.metric{padding:13px;border-radius:12px}.metric strong{font-size:19px}.card{padding:14px;border-radius:13px}.pair{grid-template-columns:1fr}.nav button{padding:11px 13px}h2{font-size:16px}th,td{padding:10px 8px}}@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style></head>
<body><header class="top"><div class="brand">DONCHI <span style="color:#63c6ab">ENTERPRISE 4.0</span><small>Business Control Center</small></div><div><a href="/platform/">Super Admin</a> <a href="/app/">Do‘kon paneli</a></div></header><main class="wrap"><h1 id="heading">Boshqaruv markazi</h1><p id="subtitle">Jonli PostgreSQL ma’lumotlari va SaaS nazorati</p><nav class="nav" id="nav" aria-label="Modullar"></nav><section id="content" aria-live="polite"><div class="skeleton">Ma’lumotlar yuklanmoqda…</div></section><p class="footer">DONCHI 4.0 · To‘lov va backup holatlari tasdiqlanmaguncha faollashtirilgan deb ko‘rsatilmaydi.</p></main>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('uz-UZ',{maximumFractionDigits:0}).format(Number(n)||0),sum=n=>fmt(n)+' so‘m';
const API={overview:'/api/v4/platform/overview',stores:'/api/v4/platform/overview',billing:'/api/v4/platform/billing',protection:'/api/v4/platform/protection',alerts:'/api/v4/platform/alerts',owner:'/api/v4/owner/dashboard'};
const menus=[['overview','Command Center'],['stores','Store 360°'],['billing','Smart Billing'],['protection','Data Protection'],['alerts','Smart Alerts'],['owner','Owner Mobile']];
let tab='overview', platform=null,ownerOnly=false;
function metric(title,value,caption=''){return '<div class="metric"><label>'+esc(title)+'</label><strong>'+esc(value)+'</strong><small>'+esc(caption)+'</small></div>'}
function badge(status){return '<span class="tag '+(status==='active'?'':'off')+'">'+esc(status==='active'?'Faol':status)+'</span>'}
function message(t,warn=false){return '<div class="notice '+(warn?'bad':'')+'">'+esc(t)+'</div>'}
function table(headers,rows){return '<div class="tableWrap"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
async function get(url){const r=await fetch(url,{credentials:'same-origin',headers:{Accept:'application/json'}});if(r.status===401){location.href='/app/';throw Error('Tizimga kirish talab etiladi')}if(!r.ok){if(r.status===403)throw Error('Bu sahifa uchun ruxsat yo‘q');throw Error('Server xatosi: '+r.status)}return r.json()}
function setNav(){ $('#nav').innerHTML=(ownerOnly?menus.filter(x=>x[0]==='owner'):menus).map(([id,t])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+t+'</button>').join('')}
function storeTable(stores){return table(['Do‘kon','Tarif','Holat','Xodim','Filial','Savdo','Qarz','Profil'],stores.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.plan)+'</td><td>'+badge(s.status)+'</td><td>'+fmt(s.users)+'</td><td>'+fmt(s.branches)+'</td><td>'+sum(s.revenue)+'</td><td>'+sum(s.debt)+'</td><td><button class="action" data-store="'+esc(s.id)+'">360° ochish</button></td></tr>'))}
async function openStore(sid){try{const r=await get('/api/v4/platform/stores/'+encodeURIComponent(sid));const s=r.store;$('#content').innerHTML='<div class="card"><div class="toolbar"><h2>'+esc(s.name)+' · 360°</h2><button class="action" data-tab="stores">Orqaga</button></div><div class="pair"><div>'+Object.entries({Tarif:s.plan,Holat:s.status,Telefon:s.phone||'—',Manzil:s.address||'—',Mahsulotlar:r.stock.products,Ombor_tannarxi:sum(r.stock.value),Savdolar:r.sales.count}).map(([a,b])=>'<div class="mini"><span>'+esc(a.replaceAll('_',' '))+'</span><strong>'+esc(b)+'</strong></div>').join('')+'</div><div><h2>Filiallar</h2>'+r.branches.map(b=>'<div class="mini"><strong>'+esc(b.name)+'</strong></div>').join('')+'<h2 style="margin-top:17px">Xodimlar</h2>'+r.users.map(u=>'<div class="mini"><span>'+esc(u.full_name)+'</span><strong>'+esc(u.role)+'</strong></div>').join('')+'</div></div></div>'}catch(e){$('#content').innerHTML=message(e.message,true)}}
async function render(){
setNav();$('#content').innerHTML='<div class="skeleton">Ma’lumotlar yuklanmoqda…</div>';
try{
 if(tab==='overview'||tab==='stores'){platform=platform||await get(API.overview);let d=platform,t=d.totals;$('#content').innerHTML=tab==='overview'?'<div class="grid">'+metric('Barcha do‘konlar',t.stores)+metric('Faol do‘konlar',t.active)+metric('Jami savdolar',sum(t.revenue),'Qaytarishlar ayrilgan')+metric('Qolgan qarz',sum(t.debt),'Jami hisoblangan')+'</div><div class="card"><h2>Do‘konlar holati</h2>'+storeTable(d.stores)+'</div>':'<div class="card"><div class="toolbar"><h2>Do‘konlarning to‘liq profili</h2><input id="filter" placeholder="Do‘kon qidirish" aria-label="Do‘kon qidirish"></div><div id="storelist">'+storeTable(d.stores)+'</div></div>';return}
 if(tab==='billing'){let d=await get(API.billing);$('#content').innerHTML='<div class="card"><h2>Tariflar va obunalar</h2>'+message(d.notice,true)+table(['Do‘kon','Tarif','Holat'],d.stores.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.plan)+'</td><td>'+badge(s.status)+'</td></tr>'))+'</div>';return}
 if(tab==='protection'){let d=await get(API.protection);$('#content').innerHTML='<div class="grid">'+metric('Database',d.database_engine)+metric('Backup',d.backup_verified?'Tasdiqlangan':'Tasdiqlanmagan')+metric('Restore sinovi',d.restore_test_verified?'Tasdiqlangan':'Tasdiqlanmagan')+'</div><div class="card"><h2>Ma’lumotlarni himoyalash</h2>'+message(d.notice,true)+'<p style="margin-top:15px">Bu bo‘lim SQL backup yaratmaydi yoki bazani tiklamaydi. Railway PostgreSQL uchun alohida zaxira va tekshiruv zarur.</p></div>';return}
 if(tab==='alerts'){let d=await get(API.alerts);$('#content').innerHTML='<div class="grid">'+metric('Kam qolgan omborlar',d.low_stock.length)+metric('Faol bo‘lmagan do‘konlar',d.inactive_stores.length)+'</div><div class="card"><h2>Kam qolgan mahsulotlar</h2>'+table(['Do‘kon','Mahsulotlar soni'],d.low_stock.map(s=>'<tr><td>'+esc(s.store_name)+'</td><td>'+fmt(s.product_count)+'</td></tr>'))+'</div><div class="card"><h2>Faol bo‘lmagan do‘konlar</h2>'+table(['Do‘kon','Holat'],d.inactive_stores.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+badge(s.status)+'</td></tr>'))+'</div>'+message('Login va kassa tafovutlarini avtomatik aniqlash hali ulanmagan.');return}
 if(tab==='owner'){let d=await get(API.owner);$('#content').innerHTML='<div class="grid">'+metric('Do‘kon',d.store.name)+metric('Sof savdo',sum(d.sales_total))+metric('Savdolar',d.sale_count)+metric('Qolgan qarz',sum(d.debt))+metric('Mahsulotlar',d.products.count)+metric('Ombor tannarxi',sum(d.products.stock_value))+'</div>'+message('Bu ko‘rsatkichlar faqat sizga biriktirilgan do‘kondan olingan.');return}
}catch(e){if(!ownerOnly&&e.message==='Bu sahifa uchun ruxsat yo‘q'){try{await get(API.owner);ownerOnly=true;tab='owner';return render()}catch{}}$('#content').innerHTML=message(e.message,true)}
}
document.addEventListener('click',e=>{const n=e.target.closest('[data-tab]');if(n){tab=n.dataset.tab;render();return}const s=e.target.closest('[data-store]');if(s)openStore(s.dataset.store)});
document.addEventListener('input',e=>{if(e.target.id==='filter'&&platform){const q=e.target.value.toLowerCase();$('#storelist').innerHTML=storeTable(platform.stores.filter(s=>s.name.toLowerCase().includes(q)))}});
render();
</script></body></html>
